<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Babe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="cursor-glow"></div>
  <canvas id="background-canvas"></canvas>
  
  <div class="page center">
    <div class="hero">
      <div class="hero-photo-container">
        <img src="images/IMG_0414.jpeg" alt="You" class="hero-photo" />
      </div>
      
      <div class="hero-content">
        <div class="pre-title">A Moment Of Truth 💕</div>
        <h1 class="hero-title">
          <span class="word" style="--index: 0">I'm</span>
          <span class="word" style="--index: 1">dangerously</span>
          <span class="word" style="--index: 2">in</span>
          <span class="word" style="--index: 3">love</span>
          <span class="word" style="--index: 4">with</span>
          <span class="word" style="--index: 5">you</span>
        </h1>
        <p class="soft-text">You're my greatest love story. Let me show you how much you mean to me.</p>
      </div>
    </div>

    <div class="cta-section">
      <p class="question-lead">Are you ready?</p>
      <a href="note.html" class="btn primary floating charm-button">
        <span class="btn-text">Let's Begin</span>
        <span class="btn-icon">💋</span>
      </a>
    </div>
  </div>

</body>
<script src="script.js"></script>
