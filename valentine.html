<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Valentine?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dreamy">
  <div class="cursor-glow"></div>

  <div class="page center">
    <span class="section-label">The Moment of Truth 💕</span>
    
    <div class="proposal-photo-container">
      <img src="images/IMG_0415.jpeg" alt="My love" class="proposal-hero-photo" />
    </div>
    
    <div class="valentine-hero">
      <h1 class="valentine-title">My Everything</h1>
      <p class="soft-text valentine-question">
        You complete me in ways I never knew possible. <br />
        You're my greatest blessing. <br />
        <span class="emphasis-text">Be mine forever?</span> 💕
      </p>
    </div>

    <div class="qa-section">
      <div id="questionPhase" class="phase-content active">
        <div class="interactive-buttons">
          <button id="acceptBtn" class="btn primary floating charm-button">
            <span class="btn-text">YES!</span>
            <span class="btn-icon">💍</span>
          </button>
          <button id="declineBtn" class="btn ghost">Not sure...</button>
        </div>
      </div>

      <div id="answersPhase" class="phase-content">
        <div class="answer-display">
          <p class="answer-text" id="answerText"></p>
          <img src="images/milaoktasafitri-cartoon.jpg" alt="Us together" class="celebration-cartoon" />
        </div>
        <a href="celebration.html" class="btn primary floating charm-button" style="margin-top: 30px; display: inline-block; text-decoration: none;">
          <span class="btn-text">Forever Begins</span>
          <span class="btn-icon">💕</span>
        </a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="valentine.js"></script>
</body>
</html>
